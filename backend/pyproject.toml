[project]
name = "veille-mica"
version = "0.1.0"
description = "Assistant RAG de veille réglementaire sur les crypto-actifs (MiCA)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=2.4.6",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
