[project]
name = "veille-mica"
version = "0.1.0"
description = "Assistant RAG de veille réglementaire sur les crypto-actifs (MiCA)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pyyaml>=6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
